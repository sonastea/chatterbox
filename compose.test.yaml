services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatterbox_test
      POSTGRES_USER: chatterbox
      POSTGRES_PASSWORD: chatterbox
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatterbox -d chatterbox_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  nats:
    image: nats:2-alpine
    ports:
      - "127.0.0.1:14222:4222"
  rabbitmq:
    image: rabbitmq:4-alpine
    ports:
      - "127.0.0.1:15672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
